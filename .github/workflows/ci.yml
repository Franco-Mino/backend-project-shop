name: CI

on:
  push:
    branches: [main, implementations]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # JOB 1: Lint + Unit Tests
  # Corre en cada push/PR. Rápido, sin base de datos.
  # ─────────────────────────────────────────────────────────
  test-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit (production deps only)
        run: npm audit --audit-level=high --omit=dev

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────
  # JOB 2: E2E Tests
  # Levanta PostgreSQL real con el service container de GitHub
  # Actions y corre los tests de integración completos.
  # ─────────────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test-unit   # solo corre si los unit tests pasan

    services:
      postgres:
        image: postgres:14.3-alpine
        env:
          # Credenciales de prueba para el contenedor efímero de CI.
          # No son secretos reales — este contenedor vive solo durante el job
          # y no es accesible desde fuera del runner de GitHub Actions.
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: project_shop_test
          POSTGRES_USER: test_user
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: project_shop_test
      DB_USERNAME: test_user
      DB_PASSWORD: test_password           # coincide con POSTGRES_PASSWORD arriba
      JWT_SECRET: test_jwt_secret_for_ci  # solo firma tokens de test, sin valor fuera de CI
      JWT_EXPIRES_IN: 1h
      REFRESH_TOKEN_EXPIRES_DAYS: 1
      # Stripe: el adaptador está mockeado en los tests e2e (overrideProvider),
      # por lo que el constructor de StripePaymentAdapter nunca corre en CI.
      # Estas variables existen como precaución defensiva.
      STRIPE_SECRET_KEY: sk_test_placeholder_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_placeholder_for_ci
      # AWS/SMTP/CAPTCHA: los adaptadores son mockeados en los tests e2e,
      # pero el módulo de configuración requiere que las variables existan.
      AWS_BUCKET_NAME: test-bucket
      AWS_BUCKET_REGION: us-east-1
      AWS_PUBLIC_KEY: test-key
      AWS_SECRET_KEY: test-secret
      SMTP_HOST: localhost
      SMTP_PORT: 587
      SMTP_SECURE: false
      SMTP_USER: test
      SMTP_PASS: test
      SMTP_FROM: test@test.com
      RECAPTCHA_SECRET_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e

  # ─────────────────────────────────────────────────────────
  # JOB 3: Docker Build
  # Verifica que la imagen Docker se construye correctamente.
  # En un pipeline real de CD, aquí también se haría el push
  # a AWS ECR o Docker Hub.
  # ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test-unit   # solo corre si los unit tests pasan

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false          # solo build, sin push (para CI)
          tags: project-shop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
